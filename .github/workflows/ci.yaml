name: CI / Quality & Tests

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Lint and Formatting checks (Ruff)
  lint-and-format:
    name: 🔍 Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ruff Linter
        run: uvx ruff check .

      - name: Run Ruff Formatter Check
        run: uvx ruff format --check .

  # 2. Automated Backend Pytest Suite with real PostgreSQL
  backend-tests:
    name: 🧪 Backend Tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickets_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tickets_test_db
        run: |
          cd backend
          alembic upgrade head
          cd ..

      - name: Run Automated Pytest Suite
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tickets_test_db
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tickets_test_db
          SLA_WARNING_SECONDS: 60
          SLA_OVERDUE_SECONDS: 180
        run: |
          PYTHONPATH=backend pytest backend/tests -v

  # 3. Frontend Build & Static Validation
  frontend-build:
    name: ⚛️ Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite SPA
        run: |
          cd frontend
          npm run build

  # 4. Docker Compose Config Validation
  docker-compose-validate:
    name: 🐳 Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy sample env
        run: cp .env.example .env

      - name: Validate Docker Compose syntax
        run: docker compose config
